[workspace]
resolver = "3"
members = [
    "crates/biomol-model",
    "crates/biomol-rna",
    "crates/biomol-modules",
    "crates/biomol-script",
    "apps/biomolcraft-cli",
    "apps/biomolcraft",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/acs-foundry/BiomolCraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.dependencies]
# Upstream ArtCraft shared libraries (storytold/craft-libs pinned commit)
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "52d2560c183b2df8b1ffc25ca2078683af146fd6" }

# CraftBio shared libraries (acs-foundry/craftbio-libs)
craftbio-sandbox = { path = "../craftbio-libs/crates/sandbox" }
craftbio-struct = { path = "../craftbio-libs/crates/struct" }
craftbio-scene = { path = "../craftbio-libs/crates/scene" }
craftbio-viewport = { path = "../craftbio-libs/crates/viewport" }
craftbio-report = { path = "../craftbio-libs/crates/report" }

# BioCraft compute crates mounted as loadable BiomolCraft modules (zero duplication)
bio-core = { path = "../BioCraft/crates/bio-core" }
bio-develop = { path = "../BioCraft/crates/bio-develop" }
bio-interface = { path = "../BioCraft/crates/bio-interface" }
bio-adc = { path = "../BioCraft/crates/bio-adc" }
bio-engine = { path = "../BioCraft/crates/bio-engine" }

# Internal BiomolCraft crates
biomol-model = { path = "crates/biomol-model" }
biomol-rna = { path = "crates/biomol-rna" }
biomol-modules = { path = "crates/biomol-modules" }
biomol-script = { path = "crates/biomol-script" }

# Standard ecosystem crates
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
overflow-checks = true
