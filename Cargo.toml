[workspace]
resolver = "3"
members = [
    "crates/bio-core",
    "crates/bio-develop",
    "crates/bio-interface",
    "crates/bio-adc",
    "crates/bio-engine",
    "crates/biomol-model",
    "crates/biomol-rna",
    "crates/biomol-physics",
    "crates/biomol-enzyme",
    "crates/biomol-modules",
    "crates/biomol-script",
    "apps/biomolcraft-cli",
    "apps/biomolcraft",
    "xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/acs-foundry/BiomolCraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.dependencies]
# Upstream ArtCraft shared libraries (storytold/craft-libs pinned commit)
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "52d2560c183b2df8b1ffc25ca2078683af146fd6" }

# CraftBio shared libraries (public acs-foundry/craftbio-libs pinned tag)
craftbio-sandbox = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.0.0" }
craftbio-struct = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.0.0" }
craftbio-scene = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.0.0" }
craftbio-viewport = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.0.0" }
craftbio-report = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.0.0" }

# Internal BiomolCraft biologics, modeling, physics & module crates (100% self-contained)
bio-core = { path = "crates/bio-core" }
bio-develop = { path = "crates/bio-develop" }
bio-interface = { path = "crates/bio-interface" }
bio-adc = { path = "crates/bio-adc" }
bio-engine = { path = "crates/bio-engine" }
biomol-model = { path = "crates/biomol-model" }
biomol-rna = { path = "crates/biomol-rna" }
biomol-physics = { path = "crates/biomol-physics" }
biomol-enzyme = { path = "crates/biomol-enzyme" }
biomol-modules = { path = "crates/biomol-modules" }
biomol-script = { path = "crates/biomol-script" }

# Standard ecosystem crates
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.31"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
overflow-checks = true
